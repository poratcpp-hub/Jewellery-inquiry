<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PORAT — אין חיבור</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Heebo', -apple-system, 'Segoe UI', sans-serif;
      background: #e9e0cf;
      background-image: radial-gradient(circle at 20% 15%, rgba(201, 163, 92, .35), transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(160, 120, 60, .25), transparent 50%);
      padding: 24px;
    }
    .card {
      max-width: 380px; width: 100%;
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.45));
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 20px;
      box-shadow: 0 18px 50px -18px rgba(60,42,20,.35);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      padding: 36px 28px;
      text-align: center;
    }
    .mark { font-family: Georgia, serif; font-size: 34px; font-weight: bold; letter-spacing: 6px; color: #7B5E1A; margin-bottom: 6px; }
    .sub { font-size: 10px; letter-spacing: 4px; color: #7B5E1A; margin-bottom: 26px; }
    h1 { font-size: 20px; color: #2c1810; margin-bottom: 10px; }
    p { font-size: 14px; color: #7a6a52; line-height: 1.6; margin-bottom: 24px; }
    button {
      font: inherit; font-weight: 600; font-size: 14px;
      color: #fdf9f0; background: #2c1810;
      border: 0; border-radius: 999px; padding: 11px 28px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">PORAT</div>
    <div class="sub">PRIVATE ◆ JEWELER</div>
    <h1>אין חיבור לאינטרנט</h1>
    <p>המערכת עובדת עם נתונים חיים ולכן דורשת חיבור. בדוק את הרשת ונסה שוב.</p>
    <button onclick="location.reload()">נסה שוב</button>
  </div>
</body>
</html>
